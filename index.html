<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Profile Signed</title>
    <style>
        body { font-family: -apple-system, sans-serif; padding: 40px 15px; text-align: center; background: #f2f2f7; }
        .card { background: white; padding: 24px; border-radius: 16px; max-width: 380px; margin: 0 auto; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h2 { margin-bottom: 8px; color: #1c1c1e; }
        p { font-size: 13px; color: #8e8e93; margin-bottom: 20px; }
        input { width: 100%; padding: 12px 14px; margin-bottom: 16px; border: 1px solid #c7c7cc; border-radius: 10px; box-sizing: border-box; font-size: 16px; outline: none; }
        button { width: 100%; padding: 14px; background: #007aff; color: white; border: none; border-radius: 10px; font-weight: 600; font-size: 16px; cursor: pointer; }
        button:disabled { background: #aeaeb2; }
    </style>
</head>
<body>

<div class="card">
    <h2>🧪 Test Profile Ký Số</h2>
    <p>Nhập username Locket để tải file cài đặt trực tiếp vào Settings:</p>
    
    <input type="text" id="username" placeholder="Ví dụ: duckjenn" value="duckjenn">
    <button id="btn" onclick="testDownload()">🚀 TẢI PROFILE KÝ SỐ TEST</button>
</div>

<script>
async function testDownload() {
    const btn = document.getElementById('btn');
    const username = document.getElementById('username').value.trim() || "testuser";
    
    btn.disabled = true;
    btn.innerText = "⏳ Đang ký số file...";

    const dnsList = ["ed4988", "c46c6d", "ab98f6", "1f7766", "8ae476", "58a9ef", "1b3dec", "e8caf2", "ba82d8", "de8631"];
    const selectedDnsId = dnsList[Math.floor(Math.random() * dnsList.length)];
    const authorName = "Duc Kien DNS";

    function generateUUID() {
        return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
            var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
            return v.toString(16).toUpperCase();
        });
    }

    const xmlContent = `<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
  <dict>
    <key>PayloadDisplayName</key>
    <string>NextDNS (${selectedDnsId}) · ${username}</string>
    <key>PayloadDescription</key>
    <string>Cấu hình DNS VIP dành cho tài khoản Locket ${username}. Vận hành bởi Duc Kien.</string>
    <key>PayloadIdentifier</key>
    <string>io.nextdns.${selectedDnsId}.profile</string>
    <key>PayloadOrganization</key>
    <string>${authorName}</string>
    <key>PayloadScope</key>
    <string>System</string>
    <key>PayloadType</key>
    <string>Configuration</string>
    <key>PayloadUUID</key>
    <string>${generateUUID()}</string>
    <key>PayloadVersion</key>
    <integer>1</integer>
    <key>PayloadContent</key>
    <array>
      <dict>
        <key>DNSSettings</key>
        <dict>
          <key>DNSProtocol</key>
          <string>HTTPS</string>
          <key>ServerURL</key>
          <string>https://apple.dns.nextdns.io/${selectedDnsId}/${encodeURIComponent(username)}</string>
        </dict>
        <key>OnDemandRules</key>
        <array>
          <dict>
            <key>Action</key>
            <string>EvaluateConnection</string>
            <key>ActionParameters</key>
            <array>
              <dict>
                <key>DomainAction</key>
                <string>NeverConnect</string>
                <key>Domains</key>
                <array>
                  <string>captive.apple.com</string>
                  <string>3gppnetwork.org</string>
                  <string>dav.orange.fr</string>
                  <string>vvm.mobistar.be</string>
                  <string>vvm.mstore.msg.t-mobile.com</string>
                  <string>tma.vvm.mone.pan-net.eu</string>
                  <string>vvm.ee.co.uk</string>
                </array>
              </dict>
            </array>
          </dict>
          <dict>
            <key>Action</key>
            <string>Connect</string>
          </dict>
        </array>
        <key>PayloadType</key>
        <string>com.apple.dnsSettings.managed</string>
        <key>PayloadIdentifier</key>
        <string>io.nextdns.${selectedDnsId}.profile.dnsSettings.managed</string>
        <key>PayloadUUID</key>
        <string>${generateUUID()}</string>
        <key>PayloadDisplayName</key>
        <string>NextDNS (${selectedDnsId}) · ${username}</string>
        <key>PayloadOrganization</key>
        <string>${authorName}</string>
        <key>PayloadVersion</key>
        <integer>1</integer>
      </dict>
    </array>
  </dict>
</plist>`;

    let blobData;
    try {
        const response = await fetch("https://sign.mobileconfig.app/api/sign", {
            method: "POST",
            headers: { "Content-Type": "text/plain" },
            body: xmlContent
        });

        if (response.ok) {
            const buffer = await response.arrayBuffer();
            blobData = new Blob([buffer], { type: 'application/x-apple-asymmetric-key-exchange' });
        } else {
            blobData = new Blob([xmlContent], { type: 'application/x-apple-asymmetric-key-exchange' });
        }
    } catch (err) {
        blobData = new Blob([xmlContent], { type: 'application/x-apple-asymmetric-key-exchange' });
    }

    const fileUrl = URL.createObjectURL(blobData);
    window.location.href = fileUrl;

    btn.disabled = false;
    btn.innerText = "🚀 TẢI PROFILE KÝ SỐ TEST";
}
</script>

</body>
</html>
